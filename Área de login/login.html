<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa das Empreiteiras | Site oficial no Brasil</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="logo2.png">
</head>
<body>

    <header class="header">

            <a href="../Área inicial/home.html">
                <img src="logo.png" id="logo" alt="Logo da Casa das Empreiteiras">
            </a>
            <ul>
            <li>Início</li>
            <li>Nós</li>
            <li>Materiais</li>
            <li>Lojas</li>
            <li>Suporte</li>
            </ul>

            <button class="login-button"><a href="../Área de login/login.html">Login</a></button>
            <button class="cadastro-button"><a href="../Área de cadastro/cadastro.html">Cadastrar</a></button>

    <main class="container">
            <img src="logo.png" alt="Imagem de login">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <button type="submit">Entrar</button>
                <li><a href="../Área de recuperação de senha/recuperar-senha.html">Esqueci a senha</a></li>
        </div>

        <div class="footer">
            <p>© 2026 Casa das Empreiteiras. Todos os direitos reservados.</p>
            <p>CNPJ: 12.345.678/0001-90</p>
        </div>
    </main>

</html>
